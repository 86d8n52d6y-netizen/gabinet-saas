<style>
  .zl-wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}

  .zl-list{display:grid;gap:8px}

  .zl-st{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--g-accent-soft);color:var(--g-accent)}
  .zl-st.braki{background:var(--g-warn-soft);color:var(--g-warn)}.zl-st.gotowe{background:var(--g-ok);color:#fff}
  .zl-sec{border:1px solid var(--g-line);border-radius:12px;background:var(--g-surface);margin:0 0 10px}
  .zl-sec>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none;display:flex;gap:8px;align-items:center}
  .zl-sec>summary::-webkit-details-marker{display:none}
  .zl-sec>summary::before{content:'▸';color:var(--g-muted)}.zl-sec[open]>summary::before{content:'▾'}
  .zl-sec .in{padding:0 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px}
  .zl-f{display:grid;gap:5px;min-width:0}.zl-f.w{grid-column:1/-1}
  .zl-f>label,.zl-f>.lb{font-size:13.5px;font-weight:600}
  .zl-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .zl-tag.W{background:var(--g-warn-soft);color:var(--g-warn)}.zl-tag.Z{background:var(--g-accent-soft);color:var(--g-accent)}
  .zl-ch{display:flex;flex-wrap:wrap;gap:6px}
  .zl-ch button{font:inherit;font-size:13.5px;border:1px solid var(--g-line);background:var(--g-surface);color:var(--g-ink);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px}
  .zl-ch button[aria-pressed="true"]{background:var(--g-accent);border-color:var(--g-accent);color:var(--g-accent-ink)}
  .zl-in{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--g-line);border-radius:9px;background:var(--g-surface);color:var(--g-ink);width:100%}
  textarea.zl-in{min-height:64px;resize:vertical}
  .zl-hint{font-size:12.5px;color:var(--g-muted)}

  .zl-bar{position:sticky;bottom:0;background:var(--g-surface);border-top:1px solid var(--g-line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
  .zl-hist{font-size:13px;color:var(--g-muted);margin:6px 0 0;padding-left:18px}
  @media print{.gbar,.zl-bar,.zl-noprint{display:none!important}}

/* ---------- pola (status: W – wymagane, Z – zalecane, O – opcjonalne) ---------- */
const STATUSY = ['wersja robocza', 'wysłane', 'przyjęte', 'do uzupełnienia', 'gotowe'];

const S = { ready: false, list: [], cur: null, dirty: false, open: {} };   // open: rozwinięte sekcje (zostają po przerysowaniu)
const isOpen = (id, def) => id in S.open ? S.open[id] : !!def;
function newNr() { const y = new Date().getFullYear(), n = S.list.filter(z => String(z.nr || '').startsWith('ZP-' + y)).length + 1; return 'ZP-' + y + '-' + String(n).padStart(3, '0'); }
function nowe(typ) { return { id: 'z' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nr: newNr(), typ: typ || '', status: 'wersja robocza', data: G.today(), a: {}, hist: [{ at: new Date().toISOString(), co: 'utworzono' }] }; }
const val = (z, k) => k === 'nr' || k === 'typ' || k === 'status' ? z[k] : (z.a || {})[k];

/* ---------- kontrola kompletności (§7) ---------- */
function braki(z) {
  const out = [], t = typOf(z);
  if (!t) out.push(['W', 'Wybierz rodzaj pracy']);
  for (const sec of sekcje(z)) for (const f of sec.pola) {
    const v = val(z, f.k), pusty = v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
    if (pusty && f.st !== 'O') out.push([f.st, f.l + ' (' + sec.tyt.toLowerCase() + ')']);
  }
  return out;
}

/* ---------- zapis (tylko urządzenie, zaszyfrowane) ---------- */
async function zapisz(co) {
  const z = S.cur; if (!z) return;
  z.at = new Date().toISOString(); if (co) { z.hist = (z.hist || []).concat([{ at: z.at, co }]).slice(-100); }
  await G.store('zlecenia').put(z.id, z);
  const i = S.list.findIndex(x => x.id === z.id); if (i >= 0) S.list[i] = JSON.parse(JSON.stringify(z)); else S.list.unshift(JSON.parse(JSON.stringify(z)));
  S.dirty = false;
}
let sT = null;
function autosave() { S.dirty = true; clearTimeout(sT); sT = setTimeout(() => zapisz().catch(() => toast('Nie udało się zapisać na tym urządzeniu.')), 600); }
function toast(t) { let el = $('#zl-toast'); if (!el) { el = document.createElement('div'); el.id = 'zl-toast'; el.className = 'g-warn'; el.setAttribute('role', 'status'); el.style.cssText = 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:20;padding:8px 14px;border-radius:10px'; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 2600); }

/* ---------- widoki ---------- */
function stCls(s) { return s === 'do uzupełnienia' ? ' braki' : s === 'gotowe' ? ' gotowe' : ''; }
function lista() {
  const rows = S.list.slice().sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  return '<div class="zl-head"><h1>Zlecenia protetyczne</h1><button type="button" class="g-btn" data-a="nowe">+ Nowe zlecenie</button></div>' +
    '<p class="g-muted" style="margin-top:0">Zlecenia są zapisane tylko na tym urządzeniu (zaszyfrowane). Gotowe zlecenie drukujesz albo zapisujesz jako PDF i przekazujesz technikowi.</p>' +
    (rows.length ? '<div class="zl-list">' + rows.map(z => { const t = typOf(z), b = braki(z).filter(x => x[0] === 'W').length;
      return '<div class="zl-item" data-id="' + z.id + '"><b>' + esc(z.nr) + '</b><span>' + esc((z.a || {}).ini || '—') + '</span><span>' + esc(t ? t.name : 'rodzaj nieokreślony') + '</span>' +
        ((z.a || {}).zeby ? '<span class="g-muted">zęby ' + esc(z.a.zeby) + '</span>' : '') + ((z.a || {}).termin ? '<span class="g-muted">termin ' + esc(z.a.termin) + '</span>' : '') +
        '<span class="zl-st' + stCls(z.status) + '">' + esc(z.status) + '</span>' + (b ? '<span class="zl-st braki">' + b + ' do uzupełnienia</span>' : '') +
        '<span class="r"><button type="button" class="g-btn sm" data-a="otworz" data-id="' + z.id + '">Otwórz</button><button type="button" class="g-btn ghost sm" data-a="kopiuj" data-id="' + z.id + '">Kopiuj</button></span></div>'; }).join('') + '</div>'
      : '<p class="g-muted">Nie ma jeszcze zleceń.</p>');
}
function poleHTML(z, f) {
  const v = val(z, f.k), id = 'f_' + f.k, tag = f.st !== 'O' ? '<span class="zl-tag ' + f.st + '" title="' + (f.st === 'W' ? 'wymagane' : 'zalecane') + '">' + (f.st === 'W' ? 'wymagane' : 'zalecane') + '</span>' : '';
  let h;
  if (f.t === 'chips1' || f.t === 'chipsN') {
    const cur = f.t === 'chipsN' ? (Array.isArray(v) ? v : []) : v;
    const opts = f.opts.concat(f.t === 'chips1' && v && !f.opts.includes(v) ? [v] : []).concat(f.t === 'chipsN' ? cur.filter(x => !f.opts.includes(x)) : []);
    h = '<span class="lb">' + esc(f.l) + tag + '</span><div class="zl-ch" role="group" aria-label="' + esc(f.l) + '">' + opts.map(o => { const on = f.t === 'chipsN' ? cur.includes(o) : cur === o;
      return '<button type="button" data-a="ch" data-k="' + f.k + '" data-m="' + (f.t === 'chipsN' ? 'N' : '1') + '" data-v="' + esc(o) + '" aria-pressed="' + on + '">' + esc(o) + '</button>'; }).join('') + '</div>' +
      (f.own !== false ? '<input class="zl-in" data-own="' + f.k + '" data-m="' + (f.t === 'chipsN' ? 'N' : '1') + '" placeholder="inne – wpisz i Enter" aria-label="' + esc(f.l) + ' – inna wartość">' : '');
  } else if (f.t === 'area') h = '<label for="' + id + '">' + esc(f.l) + tag + '</label><textarea class="zl-in" id="' + id + '" data-k="' + f.k + '">' + esc(v || '') + '</textarea>';
  else h = '<label for="' + id + '">' + esc(f.l) + tag + '</label><input class="zl-in" id="' + id + '" data-k="' + f.k + '" type="' + (f.t === 'date' ? 'date' : 'text') + '" value="' + esc(v || '') + '"' + (f.dl ? ' list="' + f.dl + '"' : '') + ' autocomplete="off">';
  return '<div class="zl-f' + (f.w ? ' w' : '') + '">' + h + (f.hint ? '<span class="zl-hint">' + esc(f.hint) + '</span>' : '') + '</div>';
}
function edytor() {
  const z = S.cur, t = typOf(z), br = braki(z), w = br.filter(x => x[0] === 'W'), zal = br.filter(x => x[0] === 'Z');
  const typy = GRUPY.map(g => { const ks = allTypes().filter(k => k.grp === g[0]); return '<div class="zl-f w"><span class="lb">' + esc(g[1]) + '</span><div class="zl-ch">' +
    ks.map(k => '<button type="button" data-a="typ" data-v="' + esc(k.id) + '" aria-pressed="' + (z.typ === k.id) + '">' + esc(k.name) + '</button>').join('') + '</div></div>'; }).join('') +
    '<div class="zl-f w"><input class="zl-in" data-owntyp="1" placeholder="inny rodzaj pracy – wpisz i Enter (zapisze się w „Moich materiałach” po dodaniu w Ustawieniach)"></div>';
  return '<div class="zl-head"><h1>' + esc(z.nr) + (t ? ' · ' + esc(t.name) : '') + '</h1><div class="zl-noprint"><button type="button" class="g-btn ghost sm" data-a="lista">← Lista zleceń</button></div></div>' +
    '<div class="zl-chk ' + (w.length ? 'warn' : 'ok') + '" id="zl-chk">' + (w.length ? '<b>Do uzupełnienia (wymagane): ' + w.length + '</b><ul>' + w.map(x => '<li>' + esc(x[1]) + '</li>').join('') + '</ul>' : '<b>Wszystkie wymagane informacje są uzupełnione.</b>') +
      (zal.length ? '<div class="zl-hint" style="margin-top:4px">Zalecane: ' + zal.map(x => esc(x[1])).join(' · ') + '</div>' : '') + '</div>' +
    '<details class="zl-sec"' + (isOpen('typ', !z.typ) ? ' open' : '') + ' data-sec="typ"><summary>Rodzaj pracy' + (t ? ': ' + esc(t.name) : '') + '</summary><div class="in">' + typy + '</div></details>' +
    sekcje(z).map(sec => '<details class="zl-sec"' + (isOpen(sec.id, sec.open) ? ' open' : '') + ' data-sec="' + sec.id + '"><summary>' + esc(sec.tyt) + '</summary><div class="in">' + sec.pola.map(f => poleHTML(z, f)).join('') + '</div></details>').join('') +
    '<details class="zl-sec"' + (isOpen('status', false) ? ' open' : '') + ' data-sec="status"><summary>Status i historia</summary><div class="in"><div class="zl-f w"><span class="lb">Status</span><div class="zl-ch">' +
      STATUSY.map(s => '<button type="button" data-a="status" data-v="' + esc(s) + '" aria-pressed="' + (z.status === s) + '">' + esc(s) + '</button>').join('') + '</div></div>' +
      '<div class="zl-f w"><label for="f_brakiLab">Braki zgłoszone przez technika / notatki z rozmów</label><textarea class="zl-in" id="f_brakiLab" data-k="brakiLab">' + esc((z.a || {}).brakiLab || '') + '</textarea></div>' +
      '<div class="zl-f w"><span class="lb">Historia zmian</span><ul class="zl-hist">' + (z.hist || []).slice().reverse().map(h => '<li>' + esc(new Date(h.at).toLocaleString('pl-PL')) + ' – ' + esc(h.co) + '</li>').join('') + '</ul></div></div></details>' +
    '<div class="zl-bar zl-noprint"><button type="button" class="g-btn ghost" data-a="usun">Usuń</button><button type="button" class="g-btn ghost" data-a="kopiuj" data-id="' + z.id + '">Kopiuj jako nowe</button><button type="button" class="g-btn" data-a="zapisz">Zapisz</button></div>';
}
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.sec) S.open[d.dataset.sec] = d.open; }, true);
function render() {
  const opt = l => l.map(n => '<option value="' + esc(n) + '">').join('');
  $('#dl-lab').innerHTML = opt(G.mat('lab', [])); $('#dl-impl').innerHTML = opt(G.mat('implant', []));
  $('#dl-kolor').innerHTML = opt(G.mat('kolor', KOLORY[((S.cur || {}).a || {}).skala] || KOLORY['Vita Classic'].concat(KOLORY['Vita 3D-Master'])));
  $('#main').innerHTML = S.cur ? edytor() : lista();
}
function odswiezKontrole() { const el = $('#zl-chk'); if (!el || !S.cur) return; const t = document.createElement('div'); t.innerHTML = edytor(); const n = t.querySelector('#zl-chk'); if (n) el.replaceWith(n); }

/* ---------- zdarzenia ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b || !S.ready) return;
  const a = b.dataset.a, z = S.cur;
  if (a === 'nowe') { S.open = {}; S.cur = nowe(); await zapisz(); render(); window.scrollTo(0, 0); return; }
  if (a === 'otworz') { const x = S.list.find(q => q.id === b.dataset.id); if (x) { S.cur = JSON.parse(JSON.stringify(x)); render(); window.scrollTo(0, 0); } return; }
  if (a === 'kopiuj') { const x = S.list.find(q => q.id === b.dataset.id) || z; if (!x) return; const n = nowe(x.typ); n.a = JSON.parse(JSON.stringify(x.a || {})); delete n.a.brakiLab;
    n.hist = [{ at: new Date().toISOString(), co: 'skopiowano z ' + x.nr }]; S.cur = n; await zapisz(); render(); window.scrollTo(0, 0); toast('Utworzono kopię ' + n.nr + ' – sprawdź zęby, inicjały i termin.'); return; }
  if (a === 'lista') { if (S.dirty) await zapisz(); S.cur = null; render(); return; }
  if (a === 'zapisz') { await zapisz('zapisano'); toast('Zapisano na tym urządzeniu.'); render(); return; }
  if (a === 'usun') { if (b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = 'Na pewno usunąć? Kliknij ponownie'; return; }
    await G.store('zlecenia').del(z.id); S.list = S.list.filter(x => x.id !== z.id); S.cur = null; render(); toast('Zlecenie usunięte z tego urządzenia.'); return; }
  if (!z) return;
  if (a === 'typ') { S.open.typ = false; z.typ = b.dataset.v; await zapisz('rodzaj pracy: ' + (typOf(z) || {}).name); render(); return; }
  if (a === 'status') { z.status = b.dataset.v; await zapisz('status: ' + z.status); render(); return; }
  if (a === 'ch') { const k = b.dataset.k, v = b.dataset.v; z.a = z.a || {};
    if (b.dataset.m === 'N') { const cur = Array.isArray(z.a[k]) ? z.a[k] : []; z.a[k] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]); } else z.a[k] = z.a[k] === v ? '' : v;
    autosave(); render(); return; }
});
document.addEventListener('input', e => { const t = e.target; if (!S.cur || !t.dataset.k) return; S.cur.a = S.cur.a || {}; if (t.dataset.k === 'nr') S.cur.nr = t.value; else S.cur.a[t.dataset.k] = t.value; autosave(); odswiezKontrole(); });
document.addEventListener('keydown', e => {
  const t = e.target; if (e.key !== 'Enter' || !S.cur) return;
  if (t.dataset.own) { e.preventDefault(); const v = t.value.trim(); if (!v) return; const k = t.dataset.own; S.cur.a = S.cur.a || {};
    if (t.dataset.m === 'N') { const cur = Array.isArray(S.cur.a[k]) ? S.cur.a[k] : []; if (!cur.includes(v)) S.cur.a[k] = cur.concat([v]); } else S.cur.a[k] = v; autosave(); render(); return; }
  if (t.dataset.owntyp) { e.preventDefault(); const v = t.value.trim(); if (!v) return; S.cur.typ = v; zapisz('rodzaj pracy: ' + v).then(render); }
});
addEventListener('pagehide', () => { if (S.dirty) zapisz(); });

/* ---------- start ---------- */
(async () => {
  try {
    await G.ready('zlecenia');
    S.list = (await G.store('zlecenia').all()).map(([, v]) => v).filter(z => z && z.id);
    S.ready = true; render();
  } catch (e) { $('#main').innerHTML = '<div class="g-err" role="alert">Nie udało się uruchomić modułu: ' + esc(e && e.message || e) + ' <button type="button" class="g-btn sm" onclick="location.reload()">Odśwież</button></div>'; }
})();
</script>
</body>
</html>
