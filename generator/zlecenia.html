<!doctype html>
<!-- Gabinet SaaS: Zlecenia protetyczne dla technika (docs/ZLECENIA_PROTETYCZNE.md). Moduł napisany dla wersji SaaS (nie ma go w starej aplikacji).
     Treść zleceń (inicjały, zęby, zgryz, kolory) – na urządzeniu (zaszyfrowana kluczem urządzenia) i na koncie (E7, decyzja 17; synchronizacja w gabinet-saas.js).
     NIGDY na serwer: imię i nazwisko (tylko pole do wydruku, niezapisywane), PESEL, adres, zdjęcia (tylko urządzenie). Formularz sterowany katalogiem (KAT / POLA) – nowy rodzaj pracy = nowy wpis w katalogu. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zlecenia protetyczne – Gabinet</title>
<link rel="stylesheet" href="/opisy-nfz/zasoby/fonts.css">
<link rel="stylesheet" href="/opisy-nfz/zasoby/wspolne.css">
<style>
  .zl-wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
  .zl-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .zl-head h1{margin:0;font-size:24px}
  .zl-list{display:grid;gap:8px}
  .zl-item{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--g-line);border-radius:12px;background:var(--g-surface)}
  .zl-item b{font-size:15px}.zl-item .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .zl-st{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--g-accent-soft);color:var(--g-accent)}
  .zl-st.braki{background:var(--g-warn-soft);color:var(--g-warn)}.zl-st.gotowe{background:var(--g-ok);color:#fff}
  .zl-sec{border:1px solid var(--g-line);border-radius:12px;background:var(--g-surface);margin:0 0 10px}
  .zl-sec>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:16px;list-style:none;display:flex;gap:8px;align-items:center}
  .zl-sec>summary::-webkit-details-marker{display:none}
  .zl-sec>summary::before{content:'▸';color:var(--g-muted)}.zl-sec[open]>summary::before{content:'▾'}
  .zl-sec .in{padding:0 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px}
  .zl-f{display:grid;gap:5px;min-width:0}.zl-f.w{grid-column:1/-1}
  .zl-f>label,.zl-f>.lb{font-size:13.5px;font-weight:600}
  .zl-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .zl-tag.W{background:var(--g-warn-soft);color:var(--g-warn)}.zl-tag.Z{background:var(--g-accent-soft);color:var(--g-accent)}
  .zl-ch{display:flex;flex-wrap:wrap;gap:6px}
  .zl-ch button{font:inherit;font-size:13.5px;border:1px solid var(--g-line);background:var(--g-surface);color:var(--g-ink);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px}
  .zl-ch button[aria-pressed="true"]{background:var(--g-accent);border-color:var(--g-accent);color:var(--g-accent-ink)}
  .zl-in{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--g-line);border-radius:9px;background:var(--g-surface);color:var(--g-ink);width:100%}
  textarea.zl-in{min-height:64px;resize:vertical}
  .zl-hint{font-size:12.5px;color:var(--g-muted)}
  .zl-chk{border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14px}
  .zl-chk.ok{background:var(--g-accent-soft)}.zl-chk.warn{background:var(--g-warn-soft);color:var(--g-warn)}
  .zl-chk ul{margin:6px 0 0;padding-left:18px}
  .zl-bar{position:sticky;bottom:0;background:var(--g-surface);border-top:1px solid var(--g-line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
  .zl-hist{font-size:13px;color:var(--g-muted);margin:6px 0 0;padding-left:18px}
  .zl-fdi{display:grid;gap:6px;overflow-x:auto;padding:4px 0}
  .zl-fdi .rz{display:flex;gap:3px;justify-content:center;min-width:max-content}
  .zl-fdi .rz .mid{width:10px;border-left:2px solid var(--g-line);margin-left:6px}
  .zl-fdi .sep{border-top:2px solid var(--g-line);margin:2px 0}
  .zl-fdi button{font:inherit;font-size:12.5px;width:36px;height:44px;border:1px solid var(--g-line);border-radius:8px;background:var(--g-surface);color:var(--g-ink);cursor:pointer;display:grid;place-items:center;line-height:1.05;padding:2px 0}
  .zl-fdi button small{font-size:10.5px;font-weight:700}
  .zl-fdi button[data-r]{background:var(--rc);border-color:var(--rc);color:#fff}
  .zl-leg{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
  .zl-ch button[data-rola]{border-left:6px solid var(--rc)}
  .zl-foto{display:flex;flex-wrap:wrap;gap:8px}
  .zl-foto figure{margin:0;width:132px;display:grid;gap:4px;font-size:12px}
  .zl-foto img{width:132px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--g-line);background:#000}
  #druk{display:none}
  #druk h2{font-size:18px;margin:0 0 4px}#druk h3{font-size:14px;margin:12px 0 4px;border-bottom:1px solid #999}
  #druk table{border-collapse:collapse;width:100%;font-size:12.5px}#druk td{border:1px solid #bbb;padding:3px 6px;vertical-align:top}#druk td:first-child{width:34%;font-weight:600}
  #druk .fdi-p{display:grid;gap:2px;justify-content:start}#druk .fdi-p .rz{display:flex;gap:2px}
  #druk .fdi-p span{width:30px;height:30px;border:1px solid #999;display:grid;place-items:center;font-size:11px;line-height:1}
  #druk .fdi-p span.on{border:2px solid #000;font-weight:700}#druk .fdi-p .mid{width:8px;border:0}
  #druk .zl-foto img{width:220px;height:165px;border:1px solid #999}
  #druk .braki{border:2px solid #b3263b;padding:6px 10px;margin:8px 0}
  @media print{.gbar,.zl-bar,.zl-noprint,#main{display:none!important}#druk{display:block!important;color:#000;background:#fff;font-size:12.5px}body{background:#fff}
    #druk h3,#druk table,#druk figure{break-inside:avoid}@page{margin:12mm}}
</style>
</head>
<body class="gp">
<!--GABINET_DANE--><script src="/opisy-nfz/zasoby/gabinet-saas.js"></script>
<div class="zl-wrap"><main id="main" aria-live="polite"><p class="g-muted">Wczytuję…</p></main></div>
<div id="druk" aria-hidden="true"></div>
<datalist id="dl-lab"></datalist><datalist id="dl-impl"></datalist><datalist id="dl-kolor"></datalist>
<script>
'use strict';
G.bar('zlecenia');
const $ = s => document.querySelector(s), esc = G.esc;

/* ---------- katalog rodzajów prac (docs/ZLECENIA_PROTETYCZNE.md §6) – rozszerzalny ---------- */
const GRUPY = [['A', 'Korony'], ['B', 'Mosty'], ['C', 'Implantoprotetyka'], ['D', 'Prace pełnołukowe (All-on-X)'], ['E', 'Prace ruchome'], ['F', 'Pozostałe']];
const M_STALE = ['cyrkon', 'e.max', 'ceramika', 'metaloceramika (CoCr)', 'PMMA', 'kompozyt'];
const KAT = [
  ['kor-pelnocer', 'A', 'Korona pełnoceramiczna', ['e.max', 'ceramika', 'cyrkon'], ['kolor', 'prep']],
  ['kor-cyrk-mono', 'A', 'Korona cyrkonowa monolityczna', ['cyrkon'], ['kolor', 'prep']],
  ['kor-cyrk-warst', 'A', 'Korona – cyrkon warstwowy', ['cyrkon'], ['kolor', 'prep']],
  ['kor-mc', 'A', 'Korona metaloceramiczna', ['metaloceramika (CoCr)'], ['kolor', 'prep']],
  ['kor-emax', 'A', 'Korona e.max', ['e.max'], ['kolor', 'prep']],
  ['kor-tymcz', 'A', 'Korona tymczasowa', ['PMMA', 'kompozyt'], ['kolor']],
  ['kor-impl', 'A', 'Korona na implancie', ['cyrkon', 'e.max', 'metaloceramika (CoCr)', 'PMMA'], ['kolor', 'impl']],
  ['most-klas', 'B', 'Most klasyczny', M_STALE, ['kolor', 'prep', 'most']],
  ['most-adh', 'B', 'Most adhezyjny', ['e.max', 'cyrkon', 'kompozyt'], ['kolor', 'prep', 'most']],
  ['most-impl', 'B', 'Most na implantach', ['cyrkon', 'metaloceramika (CoCr)', 'PMMA', 'tytan'], ['kolor', 'most', 'impl']],
  ['most-luk', 'B', 'Most pełnołukowy', M_STALE, ['kolor', 'prep', 'most', 'zgryzW']],
  ['most-tymcz', 'B', 'Most tymczasowy', ['PMMA', 'kompozyt'], ['kolor', 'most']],
  ['impl-lacznik', 'C', 'Łącznik indywidualny', ['tytan', 'cyrkon'], ['impl']],
  ['impl-tibase', 'C', 'Ti-base', ['tytan', 'cyrkon'], ['impl']],
  ['impl-przykr', 'C', 'Konstrukcja przykręcana', ['cyrkon', 'tytan', 'CoCr', 'PMMA'], ['kolor', 'impl']],
  ['impl-cem', 'C', 'Konstrukcja cementowana', ['cyrkon', 'metaloceramika (CoCr)', 'e.max'], ['kolor', 'impl']],
  ['aox-4', 'D', 'All-on-4', ['PMMA', 'kompozyt', 'tytan + akryl/kompozyt', 'CoCr + akryl/kompozyt', 'cyrkon'], ['kolor', 'impl', 'aox', 'zgryzW']],
  ['aox-6', 'D', 'All-on-6', ['PMMA', 'kompozyt', 'tytan + akryl/kompozyt', 'CoCr + akryl/kompozyt', 'cyrkon'], ['kolor', 'impl', 'aox', 'zgryzW']],
  ['aox-x', 'D', 'All-on-X', ['PMMA', 'kompozyt', 'tytan + akryl/kompozyt', 'CoCr + akryl/kompozyt', 'cyrkon'], ['kolor', 'impl', 'aox', 'zgryzW']],
  ['aox-hybr', 'D', 'Konstrukcja hybrydowa', ['tytan + akryl/kompozyt', 'CoCr + akryl/kompozyt'], ['kolor', 'impl', 'aox', 'zgryzW']],
  ['rem-calk', 'E', 'Proteza całkowita', ['akryl'], ['kolor', 'rem', 'zgryzW']],
  ['rem-czesc', 'E', 'Proteza częściowa', ['akryl'], ['kolor', 'rem']],
  ['rem-szkiel', 'E', 'Proteza szkieletowa', ['CoCr + akryl'], ['kolor', 'rem']],
  ['rem-elast', 'E', 'Proteza elastyczna', ['nylon (termoplast)'], ['kolor', 'rem']],
  ['rem-napr', 'E', 'Naprawa / podścielenie protezy', ['akryl'], ['rem']],
  ['inne-licowka', 'F', 'Licówki', ['e.max', 'ceramika', 'kompozyt'], ['kolor', 'prep']],
  ['inne-inlay', 'F', 'Inlay / onlay / overlay', ['e.max', 'kompozyt', 'cyrkon'], ['kolor', 'prep']],
  ['inne-endo', 'F', 'Endokorona', ['e.max', 'cyrkon', 'kompozyt'], ['kolor', 'prep']],
  ['inne-szyna', 'F', 'Szyna relaksacyjna / ochronna', ['akryl twardy', 'akryl twardo-miękki', 'termoplast'], ['szyna']],
].map(x => ({ id: x[0], grp: x[1], name: x[2], mats: x[3], secs: x[4] }));
const KOLORY = { 'Vita Classic': ['A1', 'A2', 'A3', 'A3,5', 'A4', 'B1', 'B2', 'B3', 'B4', 'C1', 'C2', 'C3', 'C4', 'D2', 'D3', 'D4'],
  'Vita 3D-Master': ['0M1', '0M2', '0M3', '1M1', '1M2', '2L1.5', '2L2.5', '2M1', '2M2', '2M3', '2R1.5', '2R2.5', '3L1.5', '3L2.5', '3M1', '3M2', '3M3', '3R1.5', '3R2.5', '4L1.5', '4L2.5', '4M1', '4M2', '4M3', '4R1.5', '4R2.5', '5M1', '5M2', '5M3'],
  'Bleach': ['BL1', 'BL2', 'BL3', 'BL4'] };
/* ---------- schemat zębów FDI (E3) – rola na ząb; z.a.schemat = { '11': 'korona', ... }, uwagi z.a.zUw = { '11': '…' } ---------- */
const ROLE = [['korona', 'K', '#2f6fb3'], ['filar', 'F', '#6b4fb3'], ['przęsło', 'P', '#c0601a'], ['implant', 'I', '#1f8a5b'], ['brak', 'B', '#7a7a7a'], ['uwaga', '!', '#b3263b'], ['kontakt', '•', '#8a6d00']];
const ROLA = Object.fromEntries(ROLE.map(r => [r[0], r]));
const FDI = { s: [[18, 17, 16, 15, 14, 13, 12, 11], [21, 22, 23, 24, 25, 26, 27, 28], [48, 47, 46, 45, 44, 43, 42, 41], [31, 32, 33, 34, 35, 36, 37, 38]],
  m: [[55, 54, 53, 52, 51], [61, 62, 63, 64, 65], [85, 84, 83, 82, 81], [71, 72, 73, 74, 75]] };
const FDI_ALL = new Set(FDI.s.concat(FDI.m).flat().map(String));
const fdiSort = l => l.slice().sort((x, y) => +x - +y);
const zRola = (z, r) => fdiSort(Object.keys((z.a || {}).schemat || {}).filter(n => z.a.schemat[n] === r));
/* po zmianie schematu: pola tekstowe uzupełniane ze schematu (można je potem poprawić ręcznie) */
function zSync(z) {
  const t = typOf(z), sc = (z.a || {}).schemat || {}, s = t ? t.secs : [];
  const prace = fdiSort(Object.keys(sc).filter(n => ['korona', 'filar', 'przęsło', 'implant'].includes(sc[n])));
  z.a.zeby = prace.join(', ');
  if (s.includes('most')) { z.a.filary = zRola(z, 'filar').concat(zRola(z, 'implant')).sort((x, y) => +x - +y).join(', '); z.a.przesla = zRola(z, 'przęsło').join(', '); }
  if (s.includes('aox')) z.a.aoxPoz = zRola(z, 'implant').join(', ');
  for (const n of Object.keys(z.a.zUw || {})) if (sc[n] !== 'uwaga' || !z.a.zUw[n]) delete z.a.zUw[n];
}
function fdiHTML(z) {
  const sc = (z.a || {}).schemat || {}, M = !!S.mlecz, Q = M ? FDI.m : FDI.s;
  const zab = n => { const r = ROLA[sc[n]]; return '<button type="button" data-a="zab" data-v="' + n + '" data-testid="zab-' + n + '"' + (r ? ' data-r="' + r[0] + '" style="--rc:' + r[2] + '"' : '') +
    ' aria-pressed="' + !!r + '" aria-label="ząb ' + n + (r ? ': ' + r[0] : '') + '">' + n + (r ? '<small>' + r[1] + '</small>' : '') + '</button>'; };
  const rzad = (a, b) => '<div class="rz">' + a.map(zab).join('') + '<span class="mid"></span>' + b.map(zab).join('') + '</div>';
  const uw = zRola(z, 'uwaga'), poza = Object.keys(sc).filter(n => (M ? !FDI.m.flat().includes(+n) : !FDI.s.flat().includes(+n)));
  return '<span class="lb">Schemat zębów (FDI) – wybierz rolę, potem kliknij zęby</span>' +
    '<div class="zl-ch" role="group" aria-label="Rola zęba">' + ROLE.map(r => '<button type="button" data-a="rola" data-rola="' + r[0] + '" data-v="' + r[0] + '" style="--rc:' + r[2] + '" aria-pressed="' + ((S.rola || 'korona') === r[0]) + '">' + r[1] + ' ' + esc(r[0]) + '</button>').join('') +
      '<button type="button" data-a="mlecz" aria-pressed="' + M + '">' + (M ? 'zęby mleczne (51–85)' : 'zęby stałe (11–48)') + ' – przełącz</button></div>' +
    '<div class="zl-fdi" role="group" aria-label="Schemat zębów">' + rzad(Q[0], Q[1]) + '<div class="sep"></div>' + rzad(Q[2], Q[3]) + '</div>' +
    '<span class="zl-hint">Kliknięcie zęba nadaje wybraną rolę, ponowne – usuwa. Prawa strona pacjenta po lewej (jak na schemacie w karcie).' + (poza.length ? ' Oznaczone też w ' + (M ? 'stałych' : 'mlecznych') + ': ' + esc(fdiSort(poza).join(', ')) + '.' : '') + '</span>' +
    (uw.length ? uw.map(n => '<label class="zl-hint" for="f_zuw_' + n + '">Uwaga do zęba ' + n + '</label><input class="zl-in" id="f_zuw_' + n + '" data-zuw="' + n + '" value="' + esc(((z.a || {}).zUw || {})[n] || '') + '" autocomplete="off">').join('') : '');
}
function typOf(z) { return KAT.find(k => k.id === z.typ) || (z.typ ? { id: z.typ, grp: 'F', name: z.typ, mats: M_STALE, secs: ['kolor'] } : null); }
function allTypes() { return KAT.concat(G.mat('praca', []).map(n => ({ id: n, grp: 'F', name: n, mats: M_STALE, secs: ['kolor'], own: true }))); }

/* ---------- pola (status: W – wymagane, Z – zalecane, O – opcjonalne) ---------- */
const STATUSY = ['wersja robocza', 'wysłane', 'przyjęte', 'do uzupełnienia', 'gotowe'];
function sekcje(z) {
  const t = typOf(z), s = t ? t.secs : [];
  const out = [{ id: 'pod', tyt: 'Dane podstawowe', open: true, pola: [
    { k: 'nr', l: 'Numer przypadku', t: 'text', st: 'W', hint: 'ten sam numer w nazwach plików i zdjęć' },
    { k: 'ini', l: 'Inicjały pacjenta', t: 'text', st: 'W', max: 5, hint: 'same inicjały (np. AB) – bez imienia i nazwiska' },
    { k: 'schemat', l: 'Schemat zębów', t: 'fdi', st: 'O', w: 1 },
    { k: 'zeby', l: 'Zęby (FDI)', t: 'text', st: 'W', hint: 'uzupełnia się ze schematu; można wpisać ręcznie, np. 11, 21 albo 14–16' },
    { k: 'mat', l: 'Materiał', t: 'chips1', opts: t ? G.mat(t.grp === 'C' || t.grp === 'D' ? ['kompozyt', 'inne'] : ['kompozyt'], t.mats) : [], st: 'W', own: true },
    { k: 'lab', l: 'Laboratorium / technik', t: 'text', dl: 'dl-lab', st: 'Z' },
    { k: 'termin', l: 'Termin odbioru', t: 'date', st: 'W' },
    { k: 'prio', l: 'Priorytet', t: 'chips1', opts: ['zwykły', 'pilny'], st: 'O' },
    { k: 'antag', l: 'Antagoniści i zęby sąsiednie', t: 'chips1', opts: ['skan / wycisk dołączony', 'model przeciwstawny', 'bez antagonisty'], st: 'W' },
    { k: 'etapy', l: 'Etapy', t: 'chipsN', opts: ['akceptacja projektu przed produkcją', 'przymiarka konstrukcji', 'przymiarka zębów / biskwit', 'praca gotowa bez przymiarki'], st: 'Z' },
    { k: 'pliki', l: 'Pliki wysłane osobno (skany, rejestracja zwarcia)', t: 'text', st: 'Z', hint: 'nazwy / wersje plików, np. ZP-2026-001_gora_v2.stl' },
    { k: 'uwagi', l: 'Uwagi i instrukcje szczególne', t: 'area', st: 'O', w: 1 }] }];
  const a = z.a || {}, grp = t ? t.grp : '';
  if (s.includes('most')) out.push({ id: 'most', tyt: 'Most: filary i przęsła', open: true, pola: [
    { k: 'filary', l: 'Zęby filarowe / implanty filarowe', t: 'text', st: 'W', hint: 'np. 14, 16' },
    { k: 'przesla', l: 'Przęsła (brakujące zęby)', t: 'text', st: 'W', hint: 'np. 15' },
    { k: 'przeslo', l: 'Kształt przęsła', t: 'chips1', opts: ['siodłowe', 'modyfikowane siodłowe', 'owalne (ovate)', 'higieniczne'], st: 'Z' }] });
  if (s.includes('impl')) out.push({ id: 'impl', tyt: 'Implanty – komponenty', open: true, pola: [
    { k: 'implSys', l: 'Producent i system implantu', t: 'text', dl: 'dl-impl', st: 'W' },
    { k: 'platf', l: 'Platforma / średnica połączenia', t: 'text', st: 'Z' },
    { k: 'polacz', l: 'Typ połączenia', t: 'chips1', opts: ['wewnętrzne stożkowe', 'wewnętrzne sześciokątne', 'zewnętrzne sześciokątne'], st: 'W' },
    { k: 'mocow', l: 'Mocowanie', t: 'chips1', opts: ['przykręcana', 'cementowana'], st: 'W', own: false },
    { k: 'lacznik', l: 'Łącznik', t: 'chips1', opts: ['Ti-base', 'łącznik indywidualny', 'multi-unit (MUA)', 'standardowy'], st: 'Z' },
    { k: 'scanbody', l: 'Scanbody (producent / kod)', t: 'text', st: 'Z' },
    { k: 'implWym', l: 'Średnica × długość implantu (jeśli znane)', t: 'text', st: 'O' },
    { k: 'implKat', l: 'Kąt nachylenia / dywergencja', t: 'text', st: 'O' },
    { k: 'kanal', l: 'Kanał śruby', t: 'chips1', opts: ['od strony podniebiennej / językowej', 'kanał kątowy (ASC)', 'przez powierzchnię żującą – akceptuję'], st: 'Z' },
    { k: 'profil', l: 'Profil wyłaniania', t: 'chips1', opts: ['naturalny, wg tkanek', 'kształtowanie dziąsła (podparcie)', 'wklęsły'], st: 'Z' },
    { k: 'tkanki', l: 'Tkanki miękkie – uwagi', t: 'text', st: 'O' }] });

const FOTO_MAX = 1600, FOTO_Q = 0.85, FOTO_LIMIT = 12;

  return new Promise((ok, no) => { const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const r = Math.min(1, FOTO_MAX / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', FOTO_Q)); };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('To nie jest obraz')); }; im.src = url; });
}
async function fotoDodaj(files) {

    if (!/^image\//.test(f.type)) { toast('Pominięto plik, który nie jest zdjęciem: ' + f.name); continue; }
    try { const data = await fotoSkaluj(f), k = z.id + ':' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      await G.store('zdjecia').put(k, { zid: z.id, name: f.name.slice(0, 120), data, at: new Date().toISOString() }); n++;
    } catch (e) { toast('Nie udało się dodać zdjęcia ' + f.name); }

    '<div class="zl-f w"><input class="zl-in" data-owntyp="1" placeholder="inny rodzaj pracy – wpisz i Enter (zapisze się w „Moich materiałach” po dodaniu w Ustawieniach)"></div>';
  return '<div class="zl-head"><h1>' + esc(z.nr) + (t ? ' · ' + esc(t.name) : '') + '</h1><div class="zl-noprint"><button type="button" class="g-btn ghost sm" data-a="lista">← Lista zleceń</button></div></div>' +
    '<div class="zl-chk ' + (w.length ? 'warn' : 'ok') + '" id="zl-chk">' + (w.length ? '<b>Do uzupełnienia (wymagane): ' + w.length + '</b><ul>' + w.map(x => '<li>' + esc(x[1]) + '</li>').join('') + '</ul>' : '<b>Wszystkie wymagane informacje są uzupełnione.</b>') +
      (zal.length ? '<div class="zl-hint" style="margin-top:4px">Zalecane: ' + zal.map(x => esc(x[1])).join(' · ') + '</div>' : '') + '</div>' +
    '<details class="zl-sec"' + (isOpen('typ', !z.typ) ? ' open' : '') + ' data-sec="typ"><summary>Rodzaj pracy' + (t ? ': ' + esc(t.name) : '') + '</summary><div class="in">' + typy + '</div></details>' +
    sekcje(z).map(sec => '<details class="zl-sec"' + (isOpen(sec.id, sec.open) ? ' open' : '') + ' data-sec="' + sec.id + '"><summary>' + esc(sec.tyt) + '</summary><div class="in">' + sec.pola.map(f => poleHTML(z, f)).join('') + '</div></details>').join('') +
    '<details class="zl-sec"' + (isOpen('status', false) ? ' open' : '') + ' data-sec="status"><summary>Status i historia</summary><div class="in"><div class="zl-f w"><span class="lb">Status</span><div class="zl-ch">' +
      STATUSY.map(s => '<button type="button" data-a="status" data-v="' + esc(s) + '" aria-pressed="' + (z.status === s) + '">' + esc(s) + '</button>').join('') + '</div></div>' +
      '<div class="zl-f w"><label for="f_brakiLab">Braki zgłoszone przez technika / notatki z rozmów</label><textarea class="zl-in" id="f_brakiLab" data-k="brakiLab">' + esc((z.a || {}).brakiLab || '') + '</textarea></div>' +
      '<div class="zl-f w"><span class="lb">Historia zmian</span><ul class="zl-hist">' + (z.hist || []).slice().reverse().map(h => '<li>' + esc(new Date(h.at).toLocaleString('pl-PL')) + ' – ' + esc(h.co) + '</li>').join('') + '</ul></div></div></details>' +
    fotoHTML() +
    '<details class="zl-sec"' + (isOpen('druk', false) ? ' open' : '') + ' data-sec="druk"><summary>Wydruk / PDF</summary><div class="in"><div class="zl-f w"><label for="f_pacjent">Imię i nazwisko pacjenta – tylko na wydruk</label>' +
      '<input class="zl-in" id="f_pacjent" autocomplete="off" data-testid="druk-pacjent"><span class="zl-hint">Nie zapisuje się nigdzie (ani na urządzeniu, ani w chmurze). Puste = na wydruku inicjały. PDF: w oknie drukowania wybierz „Zapisz jako PDF”.</span></div></div></details>' +
    '<div class="zl-bar zl-noprint"><button type="button" class="g-btn ghost" data-a="usun">Usuń</button><button type="button" class="g-btn ghost" data-a="kopiuj" data-id="' + z.id + '">Kopiuj jako nowe</button><button type="button" class="g-btn ghost" data-a="drukuj" data-testid="drukuj">Drukuj / PDF</button><button type="button" class="g-btn" data-a="zapisz">Zapisz</button></div>';
}
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.sec) S.open[d.dataset.sec] = d.open; }, true);
function render() {
  const opt = l => l.map(n => '<option value="' + esc(n) + '">').join('');
  $('#dl-lab').innerHTML = opt(G.mat('lab', [])); $('#dl-impl').innerHTML = opt(G.mat('implant', []));
  $('#dl-kolor').innerHTML = opt(G.mat('kolor', KOLORY[((S.cur || {}).a || {}).skala] || KOLORY['Vita Classic'].concat(KOLORY['Vita 3D-Master'])));
  const pac = ($('#f_pacjent') || {}).value || '';
  $('#main').innerHTML = S.cur ? edytor() : lista();
  if (pac && $('#f_pacjent')) $('#f_pacjent').value = pac;
}
function odswiezKontrole() { const el = $('#zl-chk'); if (!el || !S.cur) return; const t = document.createElement('div'); t.innerHTML = edytor(); const n = t.querySelector('#zl-chk'); if (n) el.replaceWith(n); }

/* ---------- zdarzenia ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b || !S.ready) return;
  const a = b.dataset.a, z = S.cur;
  if (a === 'nowe') { S.open = {}; S.foto = []; S.cur = nowe(); await zapisz(); render(); window.scrollTo(0, 0); return; }
  if (a === 'otworz') { const x = S.list.find(q => q.id === b.dataset.id); if (x) { S.cur = JSON.parse(JSON.stringify(x)); await fotoLoad(x.id); render(); window.scrollTo(0, 0); } return; }
  if (a === 'kopiuj') { const x = S.list.find(q => q.id === b.dataset.id) || z; if (!x) return; const n = nowe(x.typ); n.a = JSON.parse(JSON.stringify(x.a || {})); delete n.a.brakiLab;
    n.hist = [{ at: new Date().toISOString(), co: 'skopiowano z ' + x.nr }]; S.cur = n; S.foto = []; await zapisz(); render(); window.scrollTo(0, 0); toast('Utworzono kopię ' + n.nr + ' – sprawdź zęby, inicjały i termin.'); return; }
  if (a === 'lista') { if (S.dirty) await zapisz(); S.cur = null; render(); return; }
  if (a === 'zapisz') { await zapisz('zapisano'); toast('Zapisano na tym urządzeniu.'); render(); return; }
  if (a === 'usun') { if (b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = 'Na pewno usunąć? Kliknij ponownie'; return; }
    await fotoUsunWszystkie(z.id); await G.store('zlecenia').del(z.id); S.list = S.list.filter(x => x.id !== z.id); S.cur = null; render(); toast('Zlecenie usunięte z tego urządzenia.'); return; }
  if (!z) return;
  if (a === 'typ') { S.open.typ = false; z.typ = b.dataset.v; if (Object.keys((z.a || {}).schemat || {}).length) zSync(z); await zapisz('rodzaj pracy: ' + (typOf(z) || {}).name); render(); return; }
  if (a === 'drukuj') { await drukuj(); return; }
  if (a === 'fusun') { await G.store('zdjecia').del(b.dataset.v); await fotoLoad(z.id); await zapisz('usunięto zdjęcie'); render(); return; }
  if (a === 'rola') { S.rola = b.dataset.v; render(); return; }
  if (a === 'mlecz') { S.mlecz = !S.mlecz; render(); return; }
  if (a === 'zab') { const n = b.dataset.v, r = S.rola || 'korona'; if (!FDI_ALL.has(n)) return; z.a = z.a || {}; const sc = z.a.schemat = Object.assign({}, z.a.schemat);
    if (sc[n] === r) delete sc[n]; else sc[n] = r; zSync(z); autosave(); render(); return; }
  if (a === 'status') { z.status = b.dataset.v; await zapisz('status: ' + z.status); render(); return; }
  if (a === 'ch') { const k = b.dataset.k, v = b.dataset.v; z.a = z.a || {};
    if (b.dataset.m === 'N') { const cur = Array.isArray(z.a[k]) ? z.a[k] : []; z.a[k] = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat([v]); } else z.a[k] = z.a[k] === v ? '' : v;
    autosave(); render(); return; }
});
document.addEventListener('input', e => { const t = e.target; if (!S.cur) return;
  if (t.dataset.fopis) { const f = (S.foto || []).find(x => x.k === t.dataset.fopis); if (f) { f.opis = t.value.slice(0, 200); clearTimeout(f._t);
    f._t = setTimeout(() => { const { k, _t, ...v } = f; G.store('zdjecia').put(k, v); }, 500); } return; }
  if (t.id === 'f_pacjent') return;
  if (t.dataset.zuw) { S.cur.a.zUw = Object.assign({}, S.cur.a.zUw, { [t.dataset.zuw]: t.value }); autosave(); return; }
  if (!t.dataset.k) return; S.cur.a = S.cur.a || {}; if (t.dataset.k === 'nr') S.cur.nr = t.value; else S.cur.a[t.dataset.k] = t.value; autosave(); odswiezKontrole(); });
document.addEventListener('keydown', e => {
  const t = e.target; if (e.key !== 'Enter' || !S.cur) return;
  if (t.dataset.own) { e.preventDefault(); const v = t.value.trim(); if (!v) return; const k = t.dataset.own; S.cur.a = S.cur.a || {};
    if (t.dataset.m === 'N') { const cur = Array.isArray(S.cur.a[k]) ? S.cur.a[k] : []; if (!cur.includes(v)) S.cur.a[k] = cur.concat([v]); } else S.cur.a[k] = v; autosave(); render(); return; }
  if (t.dataset.owntyp) { e.preventDefault(); const v = t.value.trim(); if (!v) return; S.cur.typ = v; zapisz('rodzaj pracy: ' + v).then(render); }
});
document.addEventListener('change', e => { const t = e.target; if (!S.cur) return;
  if (t.dataset.foto) { fotoDodaj(t.files); t.value = ''; }
  if (t.dataset.fdruk) { S.cur.a.fotoDruk = t.checked; autosave(); }
});
addEventListener('beforeprint', () => { if (S.cur && !$('#druk').innerHTML) $('#druk').innerHTML = drukHTML(S.cur, (($('#f_pacjent') || {}).value || '').trim()); });
addEventListener('afterprint', () => { $('#druk').innerHTML = ''; });
addEventListener('pagehide', () => { if (S.dirty) zapisz(); });
/* zmiany z innego urządzenia (E7): odśwież listę; otwarte zlecenie – tylko gdy nie ma tu niezapisanych zmian */
addEventListener('gabinet:zlecenia', async e => {
  const ids = (e.detail || []), all = (await G.store('zlecenia').all()).map(([, v]) => v).filter(z => z && z.id);
  S.list = all;
  if (!S.cur) { render(); return; }
  if (!ids.includes(S.cur.id) || S.dirty) return;
  const x = all.find(z => z.id === S.cur.id);
  if (!x) { S.cur = null; render(); toast('To zlecenie usunięto na innym urządzeniu.'); return; }
  S.cur = JSON.parse(JSON.stringify(x)); render(); toast('Wczytano zmiany z innego urządzenia.');
});

/* ---------- start ---------- */
(async () => {
  try {
    await G.ready('zlecenia');
    S.list = (await G.store('zlecenia').all()).map(([, v]) => v).filter(z => z && z.id);
    S.ready = true; render();
  } catch (e) { $('#main').innerHTML = '<div class="g-err" role="alert">Nie udało się uruchomić modułu: ' + esc(e && e.message || e) + ' <button type="button" class="g-btn sm" onclick="location.reload()">Odśwież</button></div>'; }
})();
</script>
</body>
</html>
