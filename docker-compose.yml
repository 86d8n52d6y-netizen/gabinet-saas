# Gabinet – środowisko LOKALNE (komputer dewelopera). Nie służy do produkcji.
# Start: docker compose up --build   →   http://localhost:3000
# Porty są dostępne tylko z tego komputera (127.0.0.1).
name: gabinet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabinet
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Ustaw DB_ADMIN_PASSWORD w pliku .env}
    volumes:
      - dane_bazy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d gabinet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_ADMIN_URL: postgresql://migrator:${DB_ADMIN_PASSWORD}@db:5432/gabinet
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Ustaw DB_APP_PASSWORD w pliku .env}
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://gabinet_web:${DB_APP_PASSWORD}@db:5432/gabinet
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

  # Testowa skrzynka pocztowa – przechwytuje WSZYSTKIE maile (nic nie wychodzi do internetu). Podgląd: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest   # tylko lokalnie; konkretną wersję przypniemy w fazie 7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  dane_bazy:
