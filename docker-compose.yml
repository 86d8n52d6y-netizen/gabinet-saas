# Gabinet – środowisko LOKALNE (komputer dewelopera). Nie służy do produkcji.
# Start: docker compose up --build   →   http://localhost:3000   (na Macu: bash zainstaluj-mac.command)
# Porty są dostępne tylko z tego komputera (127.0.0.1).
name: gabinet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabinet
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Ustaw DB_ADMIN_PASSWORD w pliku .env}
    volumes:
      - dane_bazy:/var/lib/postgresql/data
      - ${GABINET_KOPIE:-./kopie}:/kopie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrator -d gabinet"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_ADMIN_URL: postgresql://migrator:${DB_ADMIN_PASSWORD}@db:5432/gabinet
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Ustaw DB_APP_PASSWORD w pliku .env}
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://gabinet_web:${DB_APP_PASSWORD}@db:5432/gabinet
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "Gabinet <no-reply@gabinet.local>"
      APP_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?Brak AUTH_SECRET w .env – uruchom skrypt uruchom-… ponownie}
      APP_ENC_KEY: ${APP_ENC_KEY:?Brak APP_ENC_KEY w .env – uruchom skrypt uruchom-… ponownie}
      STATUS_DETAILS: "1"          # strona /stan – tylko lokalnie
    ports:
      - "127.0.0.1:3000:3000"

  # Automatyczna kopia bazy na dysk komputera (folder GABINET_KOPIE z .env, domyślnie ./kopie): codziennie, 30 ostatnich.
  kopie:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - ${GABINET_KOPIE:-./kopie}:/kopie
      - ./scripts/kopia-bazy.sh:/kopia-bazy.sh:ro
    entrypoint: ["/bin/sh", "/kopia-bazy.sh"]

  # Testowa skrzynka pocztowa – przechwytuje WSZYSTKIE maile (nic nie wychodzi do internetu). Podgląd: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest   # tylko lokalnie (testowa skrzynka)
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  dane_bazy:
